<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splendor Lab</title>
<meta name="description" content="Play Splendor against measured computer players or friends online, with turns-to-afford on every card, hints and a study mode.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1117; --bg-soft: #161923; --card: #1a1e2b; --card-hover: #212636; --line: #2a3042;
    --text: #e8eaf0; --muted: #969db4; --accent: #6ea8fe; --accent-warm: #f0b354;
    --good: #6ee7a8; --bad: #f08c8c; --felt: #1b2a3a;
    --radius: 12px; --tabbar: 58px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { font: inherit; color: inherit; }
  #app { height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  .view { display: none; flex: 1; min-height: 0; padding: 8px 12px 8px; }
  .view.on { display: flex; flex-direction: column; }

  /* ---------------------------------------------- tab bar (phone bottom, laptop top) */
  nav.tabs { order: 2; height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: flex; background: #12151e; border-top: 1px solid var(--line); flex: none; }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs .brand { display: none; }
  @media (min-width: 900px) {
    nav.tabs { order: 0; height: 52px; padding: 0 16px; border-top: 0; border-bottom: 1px solid var(--line); justify-content: flex-start; gap: 6px; }
    nav.tabs .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; margin-right: 22px; color: var(--text); text-decoration: none; }
    nav.tabs .brand img { width: 26px; height: 26px; border-radius: 6px; }
    nav.tabs button { flex: none; flex-direction: row; font-size: 14px; padding: 0 14px; gap: 8px; border-radius: 9px; height: 38px; align-self: center; }
    nav.tabs button.on { background: rgba(110,168,254,.12); }
    nav.tabs button svg { width: 18px; height: 18px; }
    .view { padding: 12px 18px; }
  }

  /* ---------------------------------------------- common bits */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; cursor: pointer;
    font-weight: 650; transition: background .12s, transform .08s, border-color .12s, opacity .12s; white-space: nowrap; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
  .btn.warm { background: var(--accent-warm); border-color: var(--accent-warm); color: #24180a; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 34px; padding: 0 11px; font-size: 13.5px; border-radius: 8px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 42px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 650; font-size: 14px; padding: 4px 6px; }
  .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .seg button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; vertical-align: middle; flex: none; }
  .pop { position: fixed; z-index: 60; max-width: min(320px, calc(100vw - 32px)); background: #232838; border: 1px solid #3a4258; border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #2f3548; border-radius: 14px; transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .pct { font-variant-numeric: tabular-nums; font-weight: 750; }
  .small { font-size: 12.5px; }
  svg.gem { width: 18px; height: 18px; display: inline-block; vertical-align: -4px; }
  @keyframes deal { from { transform: translateY(-14px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 2px rgba(110,231,168,.9), 0 0 12px rgba(110,231,168,.6); } 50% { box-shadow: 0 0 0 2px rgba(110,231,168,.5), 0 0 4px rgba(110,231,168,.2); } }
  .deal { animation: deal .35s ease-out both; }
  .bump { animation: bump .35s ease-out; }
  .flyer { position: fixed; z-index: 90; pointer-events: none; }

  /* ---------------------------------------------- play: the table */
  #game { flex: 1; min-height: 0; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "status" "nobles" "market" "bank" "me" "acts"; }
  #g-side { display: none; }
  .status { grid-area: status; display: flex; gap: 5px; align-items: center; min-width: 0; }
  .chips { display: flex; gap: 5px; flex: 1; min-width: 0; }
  .chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 2px 7px; font-size: 12.5px; white-space: nowrap; cursor: pointer; height: 32px; transition: border-color .2s; }
  .chip.turn { border-color: var(--accent-warm); box-shadow: inset 0 -2px 0 var(--accent-warm); }
  .chip .nmx { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .chip .pts { font-weight: 850; font-size: 16px; font-variant-numeric: tabular-nums; }
  .chip .sub { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 3px; }
  .chip .sub i { width: 8px; height: 8px; border-radius: 50%; background: #c99a1f; display: inline-block; }
  .chip.away { opacity: .55; }
  .icon-btn { width: 34px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }

  .nobles { grid-area: nobles; display: flex; gap: 6px; align-items: center; height: 46px; }
  .nobles .noble { height: 46px; width: 46px; border-radius: 6px; transition: transform .15s, opacity .2s; flex: none; }
  .nobles .noble.choose { animation: glow 1.1s infinite; cursor: pointer; border-radius: 7px; }
  .nobles .noble.close { box-shadow: 0 0 0 2px var(--accent-warm); }
  .nobles .rnd { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); line-height: 1.25; }
  .nobles .rnd b { color: var(--text); font-size: 13px; }
  .nobles .rnd .final { color: var(--accent-warm); font-weight: 750; }

  .market { grid-area: market; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 6px; min-height: 0; }
  .mrow { display: flex; gap: 5px; min-height: 0; justify-content: center; align-items: center; }
  .market .slot { height: var(--ch, 100%); }
  .slot { position: relative; height: 100%; aspect-ratio: 100 / 140; flex: none; cursor: pointer; border-radius: 8px; transition: transform .14s ease, box-shadow .14s; }
  .slot svg.card { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .slot.empty { border: 1.5px dashed #2f3650; cursor: default; }
  .slot.deck .cnt { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; }
  .slot.sel { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--accent-warm), 0 8px 16px rgba(0,0,0,.5); }
  .slot.hint { box-shadow: 0 0 0 3px var(--good), 0 0 14px rgba(110,231,168,.55); }
  .tta { position: absolute; right: -3px; bottom: -3px; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 10px; background: #12151e;
    border: 1.5px solid currentColor; font-size: 11.5px; font-weight: 850; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .slot .nope { position: absolute; inset: 0; border-radius: 8px; background: rgba(15,17,23,.0); }

  .bank { grid-area: bank; display: flex; align-items: center; gap: 4px; height: 50px; }
  .tok { position: relative; width: 44px; height: 44px; flex: none; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; transition: transform .14s; }
  .tok svg.gchip { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
  .tok .n { position: absolute; right: -4px; top: -4px; background: #0f1117; border: 1px solid var(--line); border-radius: 9px; min-width: 19px; height: 19px; font-size: 11.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; font-variant-numeric: tabular-nums; }
  .tok.zero { opacity: .28; }
  .tok.pick { transform: translateY(-5px); }
  .tok.pick::after { content: attr(data-k); position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); background: var(--accent-warm); color: #24180a; font-size: 10px; font-weight: 900; border-radius: 6px; padding: 0 4px; line-height: 13px; }
  .tok.hint { box-shadow: 0 0 0 3px var(--good), 0 0 12px rgba(110,231,168,.6); }
  .bank .side { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--muted); line-height: 1.2; }

  .me { grid-area: me; display: flex; gap: 8px; align-items: stretch; background: var(--felt); border: 1px solid #2b4560; border-radius: 10px; padding: 5px 7px; height: 78px; }
  .me.turn { border-color: var(--accent-warm); }
  .holds { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; flex: 1; min-width: 0; }
  .hold { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .bon { width: 26px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 850; font-size: 14px; border: 1.5px solid rgba(0,0,0,.4); }
  .bon.none { opacity: .25; }
  .htok { position: relative; width: 30px; height: 30px; border: 0; background: none; padding: 0; cursor: default; }
  .htok svg.gchip { width: 100%; height: 100%; }
  .htok b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  .htok.zero { opacity: .25; }
  .htok.ret { cursor: pointer; }
  .htok.retd { transform: translateY(-4px); }
  .htok.retd::after { content: "−" attr(data-r); position: absolute; right: -6px; top: -6px; background: var(--bad); color: #2a0b0b; font-size: 10px; font-weight: 900; border-radius: 6px; padding: 0 3px; line-height: 13px; }
  .mine-info { display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 38px; font-size: 11px; color: #9fb6cf; line-height: 1.15; text-align: center; }
  .mine-info b { font-size: 20px; color: #fff; font-variant-numeric: tabular-nums; }
  .res { display: flex; gap: 4px; align-items: center; flex: none; }
  .res .slot { height: 64px; }
  .res .slot.empty { width: 46px; }

  .acts { grid-area: acts; display: flex; gap: 7px; align-items: center; min-height: 46px; }
  .acts .say { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.25; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .acts .say b { color: var(--text); }
  .acts .btn { min-height: 42px; padding: 0 13px; }

  @media (min-width: 900px) {
    #game { grid-template-columns: minmax(0, 1fr) 330px; column-gap: 16px;
      grid-template-areas: "status side" "nobles side" "market side" "bank side" "me side" "acts side"; }
    .market { gap: 9px; }
    .mrow { gap: 9px; }
    .nobles { height: 66px; } .nobles .noble { width: 66px; height: 66px; }
    .bank { height: 56px; } .tok { width: 50px; height: 50px; }
    .nobles, .bank, .me, .acts { width: min(100%, 780px); justify-self: center; }
    .market { justify-self: center; }
    .me { height: 92px; }
    .bon { width: 32px; height: 34px; } .htok { width: 36px; height: 36px; }
    .res .slot { height: 80px; }
    #g-side { display: flex; grid-area: side; flex-direction: column; gap: 10px; min-height: 0; }
    #g-side .panel { padding: 10px 12px; }
    .status .chips .chip { flex: 0 1 180px; }
  }
  /* side panel: opponents + log */
  .opp { display: flex; flex-direction: column; gap: 5px; padding: 8px 0; border-top: 1px solid #222838; }
  .opp:first-child { border-top: 0; padding-top: 0; }
  .opp .top { display: flex; align-items: center; gap: 7px; }
  .opp .top b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .minirow { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .opp .minirow .lb { width: 40px; font-size: 11px; color: var(--muted); }
  .mini { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .mini .sq { width: 13px; height: 15px; border-radius: 3px; border: 1px solid rgba(0,0,0,.4); }
  .mini .ci { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.4); }
  .opp .res .slot { height: 50px; }
  ul.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
  ul.log li { color: var(--muted); }
  ul.log li.mine { color: var(--text); }

  /* sheets / dialogs */
  .sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
  .sheet { width: 100%; max-width: 520px; max-height: 80dvh; background: var(--card); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; animation: up .22s ease-out; }
  @media (min-width: 900px) { .sheet-back { align-items: center; } .sheet { border-radius: 16px; max-width: 460px; } }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet h3 { margin: 0; font-size: 16px; }
  .confirm-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .confirm-back .panel { max-width: 360px; width: 100%; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2a3042; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 80; animation: up .2s; max-width: calc(100vw - 32px); }
  .end-card { display: flex; flex-direction: column; gap: 10px; }
  .end-row { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .end-row b { font-variant-numeric: tabular-nums; }
  .end-row.win { color: var(--accent-warm); font-weight: 800; }

  /* ---------------------------------------------- setup */
  .setup { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; max-width: 640px; width: 100%; margin: 0 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .hero { display: flex; align-items: center; gap: 12px; }
  .hero img { width: 46px; height: 46px; border-radius: 10px; }
  .hero h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .hero p { margin: 0; color: var(--muted); font-size: 13px; }
  .setup .panel { display: flex; flex-direction: column; gap: 9px; }
  .seatrow { display: flex; align-items: center; gap: 9px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 4px 5px 4px 10px; font-size: 14px; min-height: 42px; }
  .seatrow .seg button { min-height: 32px; font-size: 13px; padding: 2px 9px; }
  .seatrow .dot, .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .txt { font: inherit; font-size: 16px; background: var(--bg-soft); color: var(--text); border: 1px solid var(--line); border-radius: 8px; min-height: 42px; padding: 0 12px; width: 100%; min-width: 0; }
  .txt.code { text-transform: uppercase; letter-spacing: .2em; font-weight: 700; flex: 1; }
  .code-big { font-size: 38px; font-weight: 800; letter-spacing: .2em; padding-left: .2em; color: var(--accent-warm); font-variant-numeric: tabular-nums; }
  .seats { display: flex; flex-direction: column; gap: 6px; }
  .demo-row { display: flex; gap: 6px; justify-content: center; }
  .demo-row svg.card { height: 74px; width: auto; filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
  .demo-row svg.gchip { width: 34px; height: 34px; align-self: flex-end; }

  /* ---------------------------------------------- cards tab */
  .cwrap { flex: 1; min-height: 0; display: grid; gap: 10px; grid-template-rows: auto minmax(0, 1fr); }
  .chead { display: flex; flex-direction: column; gap: 8px; }
  .clist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; align-content: start; }
  .crow { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px 5px 5px; }
  .crow svg.card { height: 62px; width: auto; flex: none; }
  .crow .ct { flex: 1; min-width: 0; font-size: 13px; }
  .crow .ct b { font-size: 14px; }
  .crow .st { text-align: right; flex: none; font-size: 11px; color: var(--muted); line-height: 1.2; }
  .crow .st .pct { font-size: 16px; display: block; }
  .ccols { display: grid; grid-template-columns: repeat(3, auto); gap: 2px 14px; }
  select { font: inherit; background: var(--bg-soft); color: var(--text); border: 1px solid var(--line); border-radius: 8px; min-height: 36px; padding: 0 8px; }
  /* phone: one scroll area, the 90 cards first, then the notes, nobles and cities */
  .cbody { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; }
  @media (min-width: 900px) {
    .cwrap .chead { flex-direction: row; align-items: center; }
    .cbody { display: grid; grid-template-columns: minmax(0, 1fr) 340px; overflow: hidden; }
    .cbody .clist { grid-template-columns: repeat(2, minmax(0, 1fr)); overflow-y: auto; min-height: 0; max-height: 100%; }
    .cbody .cside { overflow-y: auto; min-height: 0; max-height: 100%; }
  }
  .cside .panel { display: flex; flex-direction: column; gap: 8px; }
  .nob-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .nob-grid svg.noble { width: 52px; height: 52px; }
  .chart svg { width: 100%; display: block; }

  /* ---------------------------------------------- study */
  .study { flex: 1; min-height: 0; display: grid; gap: 10px; grid-template-rows: auto auto minmax(0, 1fr); }
  .sum { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  .sum .big { font-size: 20px; font-weight: 800; }
  table.turns { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.turns th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; padding: 4px 5px; position: sticky; top: 0; background: var(--bg); }
  table.turns td { padding: 5px 5px; border-top: 1px solid #222838; vertical-align: top; }
  table.turns td.n { font-variant-numeric: tabular-nums; color: var(--muted); }
  .ok { color: var(--good); font-weight: 700; }
  .chart.race svg { height: 120px; }
  @media (min-width: 900px) {
    .study { grid-template-columns: 380px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .study .s-head { grid-column: 1; } .study .s-chart { grid-column: 1; grid-row: 2; align-self: start; }
    .study .s-list { grid-column: 2; grid-row: 1 / 3; }
    .chart.race svg { height: 200px; }
  }

  /* ---------------------------------------------- settings */
  .set { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .setrow { display: flex; align-items: center; gap: 10px; min-height: 48px; }
  .setrow .grow b { display: block; font-weight: 650; }
