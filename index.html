<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splendor Lab</title>
<meta name="description" content="Play Splendor against measured computer players or friends online, with turns-to-afford on every card, hints and a study mode.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/table.css?v=1">
<style>
  :root {
    --bg: #0f1117; --bg-soft: #161923; --card: #1a1e2b; --card-hover: #212636; --line: #2a3042;
    --text: #e8eaf0; --muted: #969db4; --accent: #6ea8fe; --accent-warm: #f0b354;
    --good: #6ee7a8; --bad: #f08c8c; --felt: #1b2a3a;
    --radius: 12px; --tabbar: 58px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { font: inherit; color: inherit; }
  #app { height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  .view { display: none; flex: 1; min-height: 0; padding: 8px 12px 8px; }
  .view.on { display: flex; flex-direction: column; }

  /* ---------------------------------------------- tab bar (phone bottom, laptop top) */
  nav.tabs { order: 2; height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: flex; background: #12151e; border-top: 1px solid var(--line); flex: none; }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs .brand { display: none; }
  @media (min-width: 900px) {
    nav.tabs { order: 0; height: 52px; padding: 0 16px; border-top: 0; border-bottom: 1px solid var(--line); justify-content: flex-start; gap: 6px; }
    nav.tabs .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; margin-right: 22px; color: var(--text); text-decoration: none; }
    nav.tabs .brand img { width: 26px; height: 26px; border-radius: 6px; }
    nav.tabs button { flex: none; flex-direction: row; font-size: 14px; padding: 0 14px; gap: 8px; border-radius: 9px; height: 38px; align-self: center; }
    nav.tabs button.on { background: rgba(110,168,254,.12); }
    nav.tabs button svg { width: 18px; height: 18px; }
    .view { padding: 12px 18px; }
  }

  /* ---------------------------------------------- common bits */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; cursor: pointer;
    font-weight: 650; transition: background .12s, transform .08s, border-color .12s, opacity .12s; white-space: nowrap; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary:disabled { background: #2a3042; border-color: #343b50; color: var(--muted); opacity: 1; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
  .btn.warm { background: var(--accent-warm); border-color: var(--accent-warm); color: #24180a; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 34px; padding: 0 11px; font-size: 13.5px; border-radius: 8px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 42px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 650; font-size: 14px; padding: 4px 6px; }
  .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .seg button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; vertical-align: middle; flex: none; }
  .pop { position: fixed; z-index: 60; max-width: min(320px, calc(100vw - 32px)); background: #232838; border: 1px solid #3a4258; border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #2f3548; border-radius: 14px; transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .pct { font-variant-numeric: tabular-nums; font-weight: 750; }
  .small { font-size: 12.5px; }
  svg.gem { width: 18px; height: 18px; display: inline-block; vertical-align: -4px; }
  @keyframes deal { from { transform: translateY(-14px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 2px rgba(110,231,168,.9), 0 0 12px rgba(110,231,168,.6); } 50% { box-shadow: 0 0 0 2px rgba(110,231,168,.5), 0 0 4px rgba(110,231,168,.2); } }
  .deal { animation: deal .35s ease-out both; }
  .bump { animation: bump .35s ease-out; }
  .flyer { position: fixed; z-index: 90; pointer-events: none; transform-origin: center; }
  .flyer > svg, .flyer .ff > svg, .flyer .fb > svg { width: 100%; height: 100%; display: block; }
  .flyer.card-fly > svg, .flyer.card-fly .ff, .flyer.card-fly .fb { filter: drop-shadow(0 6px 8px rgba(0,0,0,.45)); }
  .flyer { perspective: 600px; }
  .flyer .fi { position: absolute; inset: 0; transform-style: preserve-3d; }
  .flyer .ff, .flyer .fb { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .flyer .fb { transform: rotateY(180deg); }

  /* ---------------------------------------------- play: the table (a wooden table seen from your seat) */
  #v-play.on-table { color: #f3efe4; }
  #game { flex: 1; min-height: 0; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "status" "nobles" "market" "bank" "me" "acts"; }
  #g-side { display: none; }
  .status { grid-area: status; display: flex; gap: 5px; align-items: stretch; min-width: 0; }
  .icon-btn { width: 34px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: rgba(10,12,18,.55); color: #f3efe4; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; min-height: 40px; }
  .icon-btn svg { width: 18px; height: 18px; }

  /* the other players' places across the table */
  .seats-row { flex: 1; min-width: 0; display: flex; gap: 6px; }
  .seat { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 3px 4px 4px; border-radius: 8px; background: none; cursor: pointer; }
  .seat.away { opacity: .55; }
  .plate { display: flex; align-items: center; gap: 4px; height: 20px; padding: 0 5px; border-radius: 4px; min-width: 0;
    font: 700 12px/18px system-ui, -apple-system, sans-serif; color: #f6efdc; white-space: nowrap;
    background: linear-gradient(#3b2a1a, #24180d); border: 1px solid #7a5a2e; box-shadow: inset 0 1px 0 rgba(255,220,150,.25), 0 2px 4px rgba(0,0,0,.4); }
  .seat.turn .plate { border-color: #f0c35a; box-shadow: 0 0 0 2px rgba(240,195,90,.5), 0 2px 4px rgba(0,0,0,.4); }
  .plate .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .plate .nmx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .plate .pts { font-size: 14px; font-weight: 850; font-variant-numeric: tabular-nums; }
  .hand-ph { display: inline-flex; flex: none; padding-left: 4px; }
  .hand-ph .hb { width: 9px; height: 13px; margin-left: -6px; display: block; }
  .hand-ph .hb:nth-child(odd) { rotate: -8deg; } .hand-ph .hb:nth-child(even) { rotate: 6deg; }
  .hand-ph svg { width: 100%; height: 100%; display: block; }
  .hand-ph .hn { display: none; }
  .ntiles { padding: 0 2px; }
  .onob { flex: none; min-width: 13px; height: 13px; border-radius: 2px; background: #efe3c4; border: 1px solid #b49a5c; color: #3b2a12; font-size: 9.5px; line-height: 11px; text-align: center; font-weight: 850; }
  .otab { display: flex; align-items: flex-end; gap: 4px; height: 24px; min-width: 0; }
  .ocols { display: flex; gap: 2px; flex: 1 1 auto; max-width: 84px; min-width: 0; height: 100%; }
  .seat .ccol { flex: 1 1 0; max-width: 15px; }
  .ogems, .hand-lp { display: none; }
  .gtot { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 750; color: #e9dcc0; font-variant-numeric: tabular-nums; padding-bottom: 2px; }
  .gtot i { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8, #c99a1f 60%); box-shadow: 0 1px 1px rgba(0,0,0,.5); }

  /* a column of bought cards: each card shows its top edge, the front one says how many */
  .ccol { position: relative; flex: 1 1 0; min-width: 0; height: 100%; --mcw: 13px; --mch: 18px; --sl: 3px; }
  .ccol .mc { position: absolute; left: 50%; transform: translateX(-50%); width: min(var(--mcw), 100%); height: var(--mch); bottom: calc(var(--i) * var(--sl));
    border-radius: 3px; border: 1px solid #f3ead6; box-sizing: border-box; overflow: hidden;
    background: linear-gradient(rgba(255,255,255,.28), rgba(255,255,255,0) 30%), linear-gradient(var(--c) 0 30%, rgba(0,0,0,.3) 30% 31%, var(--c2) 31%);
    box-shadow: 0 1px 2px rgba(0,0,0,.55); }
  .ccol .mc .mg { position: absolute; right: 1px; top: 0; width: 42%; height: 30%; display: none; }
  .ccol .mc .mg svg { width: 100%; height: 100%; display: block; }
  .ccol .mc b { position: absolute; left: 0; right: 0; top: 30%; bottom: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 900; color: var(--ink); text-shadow: 0 0 2px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
  .ccol.none .mc.spot { bottom: 0; background: none; border: 0; box-shadow: none; }

  /* gem chips in stacks: each chip a little higher than the one under it */
  .stk { position: absolute; inset: 0; display: block; }
  .stk .st { position: absolute; left: 0; width: 100%; aspect-ratio: 1; bottom: calc(var(--i) * var(--rise, 2px)); display: block; border-radius: 50%; }
  .stk .st svg { width: 100%; height: 100%; display: block; }
  .stk .st:not(:last-child) svg { filter: brightness(.7); }
  .stk .st:first-child svg { filter: brightness(.7) drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
  .stk .st:last-child svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); }

  .nobles { grid-area: nobles; display: flex; gap: 6px; align-items: center; height: 46px; min-width: 0; }
  .ntiles { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .nobles .noble { height: 46px; width: 46px; border-radius: 6px; transition: opacity .2s; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.55)); }
  .nobles .noble.choose { animation: glow 1.1s infinite; cursor: pointer; border-radius: 7px; }
  .nobles .noble.close { box-shadow: 0 0 0 2px var(--accent-warm); }
  .nobles .rnd { margin-left: auto; text-align: right; font-size: 12px; color: #d9cbb0; line-height: 1.25; }
  .nobles .rnd b { color: #fff; font-size: 13px; }
  .nobles .rnd .final { color: var(--accent-warm); font-weight: 750; }
  .ntiles .small.muted { color: #d9cbb0; }

  .market { grid-area: market; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 6px; min-height: 0; }
  .mrow { display: flex; gap: 5px; min-height: 0; justify-content: center; align-items: center; }
  .market .slot { height: var(--ch, 100%); }
  .slot { position: relative; height: 100%; aspect-ratio: 100 / 140; flex: none; cursor: pointer; border-radius: 9% / 6.4%; transition: transform .14s ease, box-shadow .14s; }
  .slot svg.card { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)) drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  .slot.deck { box-shadow: var(--stack); }
  .slot.deck svg.card { filter: none; }
  .slot.empty { border: 1.5px dashed rgba(255,255,255,.22); background: rgba(0,0,0,.08); cursor: default; }
  .slot.deck .cnt { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); min-width: 26px; padding: 1px 6px; border-radius: 9px; background: rgba(8,10,16,.62); text-align: center; font-size: 12.5px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .slot.sel { box-shadow: 0 0 0 3px var(--accent-warm), 0 0 16px rgba(240,179,84,.55); }
  .slot.deck.sel { box-shadow: var(--stack), 0 0 0 3px var(--accent-warm), 0 0 16px rgba(240,179,84,.55); }
  .slot:active:not(.empty) { transform: scale(.97); }
  .slot.hint { box-shadow: 0 0 0 3px var(--good), 0 0 14px rgba(110,231,168,.55); }
  .tta { position: absolute; right: 3px; bottom: 3px; min-width: 21px; height: 21px; padding: 0 5px; border-radius: 11px; background: rgba(12,14,20,.88);
    border: 1.5px solid currentColor; font-size: 12px; font-weight: 850; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .tta.now { background: var(--good); border-color: var(--good); color: #0b2a1a !important; }
  .tta.far { min-width: 0; width: 12px; height: 12px; padding: 0; right: 7px; bottom: 7px; border-width: 1.5px; opacity: .8; }

  /* the gem tokens: six stacks beside the cards */
  .bank { grid-area: bank; display: flex; align-items: flex-end; gap: 4px; height: 58px; }
  .tok { position: relative; width: 44px; height: 56px; flex: none; border: 0; padding: 0; background: none; cursor: pointer; transition: transform .14s; --rise: 2px; }
  .tok .n { position: absolute; right: -4px; top: -2px; z-index: 2; background: #0f1117; border: 1px solid #3a3f52; border-radius: 9px; min-width: 19px; height: 19px; font-size: 11.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; font-variant-numeric: tabular-nums; color: #fff; }
  .tok.zero .stk, .tok.zero .n { visibility: hidden; }
  .tok.zero::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.16), rgba(0,0,0,.06) 65%, transparent 72%); }
  .tok.pick .st:last-child { box-shadow: 0 0 0 3px var(--accent-warm), 0 0 12px rgba(240,179,84,.6); }
  .tok:active:not(.zero) { transform: scale(.93); }
  .tok.pick::after { content: attr(data-k); position: absolute; left: 50%; bottom: -9px; z-index: 2; transform: translateX(-50%); background: var(--accent-warm); color: #24180a; font-size: 10px; font-weight: 900; border-radius: 6px; padding: 0 4px; line-height: 13px; }
  .tok.hint .st:last-child { box-shadow: 0 0 0 3px var(--good), 0 0 12px rgba(110,231,168,.6); }
  .bank .side { margin-left: auto; align-self: center; text-align: right; font-size: 11.5px; color: #d9cbb0; line-height: 1.2; }

  /* your edge of the table: card columns, gem stacks, nobles won, reserved cards in hand */
  .me { grid-area: me; display: flex; gap: 8px; align-items: stretch; padding: 5px 7px; height: 86px; }
  .me.turn .mine-info b { color: var(--accent-warm); }
  .holds { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; flex: 1; min-width: 0; }
  .hold { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; min-width: 0; }
  .hold.ret { cursor: pointer; }
  .me .ccol { flex: none; width: 100%; height: 38px; --mcw: 20px; --mch: 26px; --sl: 4px; }
  .me .ccol .mc .mg { display: block; }
  .me .ccol .mc b { font-size: 13px; }
  .nobcol { display: flex; align-items: flex-end; justify-content: center; }
  .nobcol .mnob { width: 28px; height: 28px; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .nobcol .nn { position: absolute; right: -2px; top: 4px; background: #0f1117; border-radius: 7px; font-size: 10px; padding: 0 4px; line-height: 14px; }
  .htok { position: relative; width: 100%; max-width: 28px; aspect-ratio: 28 / 34; flex: none; border: 0; background: none; padding: 0; cursor: default; --rise: 2px; }
  .htok b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  .htok.zero .stk, .htok.zero b { visibility: hidden; }
  .htok.ret { cursor: pointer; }
  .htok.retd .st:last-child { box-shadow: 0 0 0 2px var(--bad), 0 0 6px var(--bad); }
  .htok.retd::after { content: "−" attr(data-r); position: absolute; right: -6px; top: -6px; z-index: 2; background: var(--bad); color: #2a0b0b; font-size: 10px; font-weight: 900; border-radius: 6px; padding: 0 3px; line-height: 13px; }
  .mine-info { display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 38px; font-size: 11px; color: #d9cbb0; line-height: 1.15; text-align: center; }
  .mine-info b { font-size: 20px; color: #fff; font-variant-numeric: tabular-nums; }
  .res { display: flex; gap: 4px; align-items: center; flex: none; }
  .res.hand { width: 96px; justify-content: center; }
  .hand .slot { height: 58px; margin-left: -16px; transform-origin: 50% 100%; }
  .hand .slot:first-child { margin-left: 0; }
  .hand.n1 .slot { rotate: -4deg; }
  .hand.n2 .slot:nth-child(1) { rotate: -5deg; } .hand.n2 .slot:nth-child(2) { rotate: 5deg; }
  .hand.n3 .slot:nth-child(1) { rotate: -8deg; } .hand.n3 .slot:nth-child(3) { rotate: 8deg; }
  .hand .slot svg.card { filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  @media (max-width: 360px) {
    .me { gap: 5px; padding: 5px; } .mine-info { min-width: 30px; } .res.hand { width: 84px; } .hand .slot { height: 50px; }
    .holds { gap: 2px; } .htok b { font-size: 11px; }
  }

  .acts { grid-area: acts; display: flex; gap: 7px; align-items: center; min-height: 46px; background: rgba(10,12,18,.62); border-radius: 10px; padding: 2px 3px 2px 10px; }
  .acts .say { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.25; color: #b9bdcc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .acts .say b { color: var(--text); }
  .acts.go .say b:first-child { color: var(--accent-warm); }
  .acts .btn { min-height: 40px; padding: 0 13px; }

  @media (min-width: 900px) {
    #game { grid-template-columns: minmax(0, 1fr) auto auto auto minmax(0, 1fr) 300px; column-gap: 14px; row-gap: 10px;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      grid-template-areas: "status status status status status side" ". . nobles . . side" ". . market bank . side" ". me me me . side" ". acts acts acts . side"; }
    .status, .me, .acts { contain: inline-size; }
    .market { gap: 10px; }
    .mrow { gap: 10px; }
    .nobles { height: 68px; gap: 10px; }
    .ntiles { gap: 10px; }
    .nobles .noble { width: 68px; height: 68px; }
    .nobles .rnd { font-size: 13px; }
    .nobles .rnd b { font-size: 16px; }
    .bank { flex-direction: column; height: auto; align-self: center; gap: 6px; }
    .tok { width: 50px; height: 62px; }
    .tok .n { min-width: 22px; height: 22px; font-size: 13px; border-radius: 11px; }
    .bank .side { margin: 2px 0 0; text-align: center; }
    .slot.deck .cnt { font-size: 14px; }
    .tta { min-width: 24px; height: 24px; font-size: 13.5px; border-radius: 12px; }
    .tta.far { min-width: 0; width: 14px; height: 14px; }
    .seats-row { gap: 12px; justify-content: center; }
    .seat { max-width: 380px; padding: 6px 8px; gap: 5px; }
    .plate { height: 24px; font-size: 13.5px; padding: 0 8px; gap: 6px; }
    .plate .pts { font-size: 17px; }
    .plate .dot { width: 9px; height: 9px; }
    .hand-ph, .gtot { display: none; }
    .onob { min-width: 16px; height: 16px; font-size: 11px; line-height: 14px; }
    .otab { height: 48px; gap: 8px; }

  /* sheets / dialogs */

  /* ---------------------------------------------- setup */

    background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; }
